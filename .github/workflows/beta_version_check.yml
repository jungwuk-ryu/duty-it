name: Beta App Version Check

on:
  pull_request:
    types: [opened, synchronize]
    branches: [beta]

jobs:
  beta-app-version-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare versions
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin release:refs/remotes/origin/release

          release_ver_full="$(git show origin/release:pubspec.yaml | awk -F': *' '$1=="version"{print $2; exit}')"
          beta_ver_full="$(awk -F': *' '$1=="version"{print $2; exit}' pubspec.yaml)"
          release_marketing_ver="${release_ver_full%%+*}"
          beta_marketing_ver="${beta_ver_full%%+*}"

          if [[ "${beta_marketing_ver}" == "${release_marketing_ver}" ]]; then
            echo "❌ FAIL: 릴리즈 버전과 베타의 버전이 동일합니다."
            exit 1
          fi

          latest_marketing_ver="$(printf '%s\n%s\n' "${release_marketing_ver}" "${beta_marketing_ver}" | sort -V | tail -n 1)"
          if [[ "${latest_marketing_ver}" != "${beta_marketing_ver}" ]]; then
            echo "❌ FAIL: 베타 버전은 릴리즈 버전보다 높아야 합니다."
            exit 1
          fi

          echo "✅ OK"
